name: CD (Deploy)

# Flow: push to staging -> CI (sync check + kubeconform + kind smoke test)
# -> only if all green -> CI calls this workflow -> Terraform + SSM deploy.
# Deploy logic lives only here; ci.yml just calls it. workflow_dispatch allows
# a manual redeploy from the Actions tab.
on:
  workflow_call: {}
  workflow_dispatch: {}

concurrency:
  group: cd-staging
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # request the GitHub OIDC token exchanged for AWS credentials

env:
  # Same bucket as the Terraform backend (staging/backend.tf).
  BUNDLE_BUCKET: sockshop-terraform-state-414772274298
  APP_URL: https://sockshop-staging.link

jobs:
  deploy-staging:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 40
    env:
      DEPLOY_SHA: ${{ github.sha }}

    steps:
      - name: Checkout the commit CI tested
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      # OIDC: no stored keys. The role only trusts this repo's `staging`
      # environment; see staging/github-oidc/.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: cd-staging-${{ github.run_id }}
          aws-region: eu-central-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6
          terraform_wrapper: false

      - name: Terraform apply (staging)
        working-directory: staging
        shell: bash
        run: |
          set -euo pipefail
          terraform init -input=false
          terraform apply -input=false -auto-approve
          echo "INSTANCE_ID=$(terraform output -raw server_instance_id)" >> "$GITHUB_ENV"

      - name: Start instance if the idle alarm stopped it
        shell: bash
        run: |
          set -euo pipefail
          STATE=$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].State.Name' --output text)
          echo "Instance $INSTANCE_ID is $STATE"
          if [ "$STATE" = "stopping" ]; then
            aws ec2 wait instance-stopped --instance-ids "$INSTANCE_ID"
            STATE=stopped
          fi
          if [ "$STATE" = "stopped" ]; then
            aws ec2 start-instances --instance-ids "$INSTANCE_ID" >/dev/null
          fi
          aws ec2 wait instance-running --instance-ids "$INSTANCE_ID"

      - name: Wait for SSM agent
        shell: bash
        run: |
          set -euo pipefail
          timeout 600 bash -c 'until aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
              --query "InstanceInformationList[0].PingStatus" --output text | grep -q Online; do
            echo "Waiting for SSM..."; sleep 10; done'
          echo "SSM agent is online"

      - name: Upload manifest bundle
        shell: bash
        run: |
          set -euo pipefail
          KEY="deploy-bundles/staging/${DEPLOY_SHA}.tgz"
          tar -czf /tmp/bundle.tgz deploy/kubernetes/complete-demo.yaml deploy/kubernetes/manifests-monitoring
          aws s3 cp /tmp/bundle.tgz "s3://${BUNDLE_BUCKET}/${KEY}"
          URL=$(aws s3 presign "s3://${BUNDLE_BUCKET}/${KEY}" --expires-in 1800)
          echo "::add-mask::${URL}"
          echo "BUNDLE_URL=${URL}" >> "$GITHUB_ENV"

      - name: Deploy shop + monitoring via SSM (kubectl runs on the node)
        shell: bash
        run: |
          set -euo pipefail
          # Use a non-sed-special delimiter: presigned URLs contain & and /.
          python3 - <<'PY'
          import os
          s = open("staging/remote-deploy.sh").read()
          open("/tmp/remote-deploy.sh", "w").write(s.replace("__BUNDLE_URL__", os.environ["BUNDLE_URL"]))
          PY
          bash staging/ssm-run.sh "$INSTANCE_ID" /tmp/remote-deploy.sh 1500

      - name: End-to-end check through Route 53 + ALB
        shell: bash
        run: |
          set -euo pipefail
          # ALB health check needs 2 x 30s healthy probes after a (re)start.
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null -w "HTTP %{http_code}\n" "$APP_URL/"; then
              echo "Sock Shop is live at $APP_URL"
              exit 0
            fi
            echo "Not reachable yet ($i/30)..."; sleep 10
          done
          echo "Sock Shop not reachable at $APP_URL"
          exit 1

      - name: Clean up bundle
        if: always()
        shell: bash
        run: aws s3 rm "s3://${BUNDLE_BUCKET}/deploy-bundles/staging/${DEPLOY_SHA}.tgz" || true
